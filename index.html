<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Cignetti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f3ee; --panel:#ffffff; --ink:#1c2230; --muted:#6b7280; --line:#e4e0d6; --line2:#efece5;
  --accent:#2f5d50; --accent-2:#e7efe9; --gold:#a8834a; --neg:#b23b3b; --pos:#2f6b45; --warn:#9a6b10; --warn-bg:#fff6e0;
  --calc:#f3f0e8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{background:var(--ink);color:#fff;padding:18px 28px 0}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font:600 22px "IBM Plex Serif",serif;margin:0;letter-spacing:.2px}
.brand .sub{color:#b9c0cc;font-size:13px}
nav{display:flex;gap:2px;margin-top:14px}
nav button{background:none;border:0;color:#b9c0cc;padding:10px 16px;font:500 14px inherit;font-family:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
nav button:hover{color:#fff}
main{padding:22px 28px 60px;max-width:1700px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
select,input,textarea{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 9px;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent-2);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:#fff}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:7px 14px;font:500 14px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{border-color:var(--neg);color:var(--neg);background:#fff}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.kpi .v{font:600 22px "IBM Plex Sans";margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:calc(100vh - 290px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;text-align:right}
th{background:#faf8f3;font-size:12px;font-weight:600;color:var(--muted);position:sticky;top:0;z-index:2}
thead tr.g th{top:0;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line)}
thead tr.h th{top:33px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}
thead th:first-child{z-index:3;background:#faf8f3}
tbody tr{background:#fff}
tbody tr.calc{background:var(--calc)}
tbody tr.calc td{font-weight:600}
tbody tr.calc.big td{font-weight:700;border-top:2px solid var(--ink)}
tbody tr.sub td{color:#454b57;font-size:13px}
tbody tr.sub td:first-child{padding-left:38px}
tbody tr.cat td{font-size:12.5px;color:var(--gold);font-weight:600}
tbody tr.cat td:first-child{padding-left:26px}
tbody tr.warn{background:var(--warn-bg)}
tbody tr.extra td{color:#454b57;font-style:italic}
td.tot,th.tot{background:#f7f5ef;font-weight:600}
td.pctc,th.pctc{color:var(--accent);font-size:12px;min-width:64px;padding-left:4px}
td.num:not(.pctc){padding-right:6px}
td.pctc.sep,th.pctc.sep{border-right:1px solid var(--line2)}
td.pctc.neg{color:var(--neg)}
tbody tr.calc td.tot{background:#ebe6da}
.num.neg{color:var(--neg)}
.rlabel{display:flex;align-items:center;gap:8px}
.rlabel .n{color:var(--gold);font-weight:700;width:18px;display:inline-block}
.tg{cursor:pointer;user-select:none}
.tg .car{display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
.tg.open .car{transform:rotate(90deg)}
.pct{display:block;font-size:11px;color:var(--muted);font-weight:400}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.banner{padding:9px 14px;border-radius:8px;margin-bottom:14px;font-size:13px}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f0d9a4}
.banner.info{background:var(--accent-2);color:var(--accent);border:1px solid #cfe0d5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
h2{font:600 17px "IBM Plex Serif",serif;margin:0 0 12px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:18px 0 8px}
.formrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
table.list td,table.list th{text-align:left}
table.list td.r,table.list th.r{text-align:right}
table.list input,table.list select{padding:4px 6px;font-size:13px}
table.list td{padding:5px 10px}
.pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11.5px;background:var(--line2);color:#454b57}
.pill.sin{background:var(--warn-bg);color:var(--warn)}
.empty{padding:50px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
details.pond{margin-bottom:16px;padding:12px 18px}
details.pond summary{cursor:pointer;font-size:13.5px}
#login{position:fixed;inset:0;background:var(--ink);display:none;align-items:center;justify-content:center;z-index:60}
#login.on{display:flex}
#login .card{background:#fff;border-radius:14px;padding:30px 32px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#login h2{margin:0 0 4px}
#login .fld{margin-top:12px}
#login input{width:100%}
#login .btn{width:100%;margin-top:18px;padding:10px}
#login .lnk{display:block;text-align:center;margin-top:12px;font-size:13px;color:var(--accent);cursor:pointer;background:none;border:0;width:100%}
#login .err{color:var(--neg);font-size:13px;margin-top:10px;min-height:18px}
#userBox{display:none;align-items:center;gap:8px;font-size:12.5px;color:#d8dde6}
#userBox button{background:none;border:1px solid #47506a;color:#d8dde6;border-radius:6px;padding:4px 10px;font:12.5px inherit;font-family:inherit;cursor:pointer}
.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.status{font-size:12px;color:#b9c0cc;margin-left:auto}
.dlg{position:fixed;inset:0;background:rgba(20,24,32,.45);display:none;align-items:center;justify-content:center;z-index:40}
.dlg.on{display:flex}
.dlg .box{background:#fff;border-radius:12px;padding:20px;min-width:340px;max-width:560px}
textarea.code{width:100%;height:200px;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Portal Cignetti</h1>
    <span class="sub" id="hdrSub">Estado de resultados por firma y actividad · USD</span>
    <span class="status" id="status">Conectando…</span>
    <span id="userBox"><span id="userMail"></span><span id="userRol" class="pill" style="background:#2f3a52;color:#d8dde6"></span><button id="btnSalir">Salir</button></span>
    <button id="btnNov" style="background:none;border:1px solid #47506a;color:#d8dde6;border-radius:6px;padding:4px 10px;font:12.5px inherit;font-family:inherit;cursor:pointer">Novedades · v<span id="verTxt"></span></button>
  </div>
  <nav id="nav">
    <button data-t="er" class="on">Estado de resultados</button>
    <button data-t="carga">Carga de conceptos</button>
    <button data-t="plan">Plan de cuentas</button>
    <button data-t="maestros">Campañas, firmas y actividades</button>
    <button data-t="datos">Exportar / importar</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div id="login"><div class="card" id="loginCard"></div></div>
<div class="dlg" id="dlg"><div class="box" id="dlgBox"></div></div>

<script>
/* ===================== Versión y novedades ===================== */
const APP_VERSION = "1.5.1";
const NOVEDADES = [
  {v:"1.5.1", f:"16/11/2026", items:["La app pasa a llamarse Portal Cignetti."]},
  {v:"1.5.0", f:"16/11/2026", items:["La app se publica en GitHub (Portal-Cignetti) y guarda los datos en una base propia en la nube: ya no hace falta cuenta de claude.ai.","Ingreso con mail y contraseña. Los usuarios de consulta ven el estado de resultados; los editores además cargan conceptos, plan de cuentas y campañas.","Recuperación de contraseña por mail."]},
  {v:"1.4.0", f:"12/11/2026", items:["Cada actividad muestra su propio % sobre ventas al lado del importe: la estructura de costos de cada unidad de negocio se lee directo.","Selector «Mostrar»: USD y %, solo USD o solo %."]},
  {v:"1.3.0", f:"12/11/2026", items:["Versión instalable para Windows (Cierre Cignetti), con actualizaciones automáticas al abrir.","Al ingresar se muestran las novedades de cada versión. También podés verlas desde el botón «Novedades»."]},
  {v:"1.2.0", f:"12/11/2026", items:["Asignación de la estructura general a cada unidad de negocio según su % de facturación sobre la facturación total del grupo (o de cada firma).","Tabla de ponderadores con la facturación, el % y los costos asignados a cada unidad."]},
  {v:"1.1.0", f:"12/11/2026", items:["Columna «% s/ ventas» para cada partida, en el total del grupo, en cada firma y en el detalle por cuenta.","La comparación entre campañas y la exportación a Excel incluyen los porcentajes."]},
  {v:"1.0.0", f:"12/11/2026", items:["Estado de resultados por firma y actividad con la estructura Ventas → Margen neto.","Carga manual de conceptos y pegado desde Excel; plan de cuentas con asignación a rubros.","Cierre de la campaña 25/26 cargado y conciliado con el informe institucional."]},
];
const cmpV=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<3;i++){const d=(x[i]||0)-(y[i]||0);if(d)return Math.sign(d);}return 0;};
function verNovedades(todas){
  let visto=null; try{ visto=localStorage.getItem("cierre-version-vista"); }catch(e){}
  const lista = todas||!visto ? NOVEDADES : NOVEDADES.filter(n=>cmpV(n.v,visto)>0);
  if(!lista.length) return;
  $("#dlgBox").innerHTML=`<h2 style="margin-bottom:4px">Novedades${!todas&&visto?" desde tu último ingreso":""}</h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:12px">Versión actual ${APP_VERSION}</div>
    <div style="max-height:60vh;overflow:auto">${lista.map(n=>`<div style="margin-bottom:14px"><div style="font-weight:600">Versión ${n.v} <span class="muted" style="font-weight:400">· ${n.f}</span></div><ul style="margin:6px 0 0 18px;padding:0">${n.items.map(i=>`<li style="margin-bottom:4px">${esc(i)}</li>`).join("")}</ul></div>`).join("")}</div>
    <div style="text-align:right;margin-top:10px"><button class="btn" id="dlgOk">Entendido</button></div>`;
  $("#dlg").classList.add("on");
  $("#dlgOk").addEventListener("click",()=>{ $("#dlg").classList.remove("on"); try{ localStorage.setItem("cierre-version-vista",APP_VERSION); }catch(e){} });
}

/* ===================== Constantes ===================== */
const RUBROS = [
  {id:"ventas", n:1, nombre:"Ventas", signo:1},
  {id:"costo_ventas", n:2, nombre:"Costo de ventas", signo:-1},
  {id:"estructura", n:4, nombre:"Costos de estructura", signo:-1},
  {id:"intereses", n:6, nombre:"Intereses financieros", signo:-1},
  {id:"amortizaciones", n:7, nombre:"Amortizaciones de bienes de uso", signo:-1},
  {id:"impuestos", n:8, nombre:"Impuestos", signo:-1},
  {id:"retiros", n:9, nombre:"Retiros", signo:-1},
  {id:"tenencia", n:"", nombre:"Resultado por tenencia", signo:1},
  {id:"sin_asignar", n:"", nombre:"Sin asignar", signo:-1},
];
const RB = Object.fromEntries(RUBROS.map(r=>[r.id,r]));
const CATS_DEFAULT = ["Gerenciamiento","Inmobiliario","Administración","Directos fijos"];

/* ===================== Estado ===================== */
let M = {firmas:[],actividades:[],campanas:[],categorias:CATS_DEFAULT.slice()};
let P = {cuentas:[]};
let CAMPS = {};  // id -> {lineas:[]}
const ui = {tab:"er", camp:null, firma:"all", vista:"actividad", modo:"both", prorrateo:"fact_grupo", pondOpen:true, comp:"", open:new Set(),
  cf:{firma:"all",act:"all",rubro:"all",q:""}};
let store = null;   // adaptador de persistencia
let loaded = {m:false,p:false,c:false};

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt0 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:0,minimumFractionDigits:0});
const fmt2 = new Intl.NumberFormat("es-AR",{maximumFractionDigits:2,minimumFractionDigits:2});
const fnum = (v,d0=true)=>{ if(v===null||v===undefined||isNaN(v)) return "–"; if(Math.abs(v)<0.005) return "–"; return (d0?fmt0:fmt2).format(v); };
const fpct = v=> (v===null||!isFinite(v))?"–":(v*100).toLocaleString("es-AR",{maximumFractionDigits:1,minimumFractionDigits:1})+"%";
const slug = s=>String(s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||("x"+Date.now());
const uid = ()=> "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2200);}
function parseNum(s){ if(typeof s==="number") return s; s=String(s).trim().replace(/\s/g,"").replace(/USD|\$/gi,"");
  let neg=false; if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(s.includes(",")&&s.includes(".")){ if(s.lastIndexOf(",")>s.lastIndexOf(".")) s=s.replace(/\./g,"").replace(",","."); else s=s.replace(/,/g,""); }
  else if(s.includes(",")){ const p=s.split(","); s = (p.length===2 && p[1].length!==3) ? s.replace(",",".") : s.replace(/,/g,""); }
  else if((s.match(/\./g)||[]).length>1) s=s.replace(/\./g,"");
  const v=parseFloat(s); return isNaN(v)?NaN:(neg?-v:v); }

const cuentaById = id => P.cuentas.find(c=>c.id===id);
const firmaN = id => (M.firmas.find(f=>f.id===id)||{}).nombre||id;
const actById = id => M.actividades.find(a=>a.id===id);
const actN = id => (actById(id)||{}).nombre||id;
const rubroDe = l => { const c=cuentaById(l.c); return c&&RB[c.rubro]?c.rubro:"sin_asignar"; };
const catDe = l => { const c=cuentaById(l.c); return (c&&c.cat)||"Sin categoría"; };
const lineasDe = id => (CAMPS[id]&&CAMPS[id].lineas)||[];

/* ===================== Persistencia ===================== */
const queues = {};
function enqueue(path, fn){ const q=(queues[path]||Promise.resolve()).then(fn).catch(e=>{console.error(e); toast("No se pudo guardar: "+(e.code||e.message||e)); if(e&&e.code==="invalid_argument") readOnly=true;}); queues[path]=q; return q; }
let readOnly=false;
let soloLectura=false;   // usuario de consulta (Supabase)

function localAdapter(){
  const K="cierre-grupo-v1";
  let data={}; try{data=JSON.parse(localStorage.getItem(K)||"{}");}catch(e){}
  const persist=()=>{try{localStorage.setItem(K,JSON.stringify(data));}catch(e){}};
  return {
    kind:"local",
    start(){ M=Object.assign(M,data.maestros||{}); P=data.plan||P; CAMPS=data.camps||{}; loaded={m:true,p:true,c:true}; render(); },
    saveMaestros(){ data.maestros=M; persist(); },
    savePlan(){ data.plan=P; persist(); },
    saveCamp(id){ data.camps=CAMPS; persist(); },
    deleteCamp(id){ delete CAMPS[id]; data.camps=CAMPS; persist(); },
  };
}
function dbAdapter(db){
  const clone=o=>JSON.parse(JSON.stringify(o));
  return {
    kind:"db",
    start(){
      const timer=setTimeout(()=>{ if(!(loaded.m&&loaded.p&&loaded.c)) setStatus("La base no responde todavía; los datos pueden no estar al día",true); },10000);
      const done=()=>{ if(loaded.m&&loaded.p&&loaded.c){ clearTimeout(timer); setStatus("Guardado en la nube"); } render(); };
      const err=e=>{ clearTimeout(timer); setStatus("Error de conexión: "+(e.code||""),true); };
      db.doc("config/maestros").onSnapshot(s=>{ if(s.exists){ const d=s.data(); M={firmas:d.firmas||[],actividades:d.actividades||[],campanas:d.campanas||[],categorias:d.categorias||CATS_DEFAULT.slice()}; } if(!s.metadata.fromCache) loaded.m=true; done(); },err);
      db.doc("config/plan").onSnapshot(s=>{ if(s.exists) P={cuentas:(s.data().cuentas||[])}; if(!s.metadata.fromCache) loaded.p=true; done(); },err);
      db.collection("campanas").onSnapshot(q=>{ const o={}; q.docs.forEach(d=>{o[d.id]=d.data();}); CAMPS=o; if(!q.metadata.fromCache) loaded.c=true; done(); },err);
    },
    saveMaestros(){ const d=clone(M); return enqueue("m",()=>db.doc("config/maestros").set(d)); },
    savePlan(){ const d=clone(P); return enqueue("p",()=>db.doc("config/plan").set(d)); },
    saveCamp(id){ const d=clone(CAMPS[id]||{lineas:[]}); return enqueue("c/"+id,()=>db.doc("campanas/"+id).set(d)); },
    deleteCamp(id){ delete CAMPS[id]; return enqueue("c/"+id,()=>db.doc("campanas/"+id).delete()); },
  };
}
function setStatus(t,warn){ const e=$("#status"); e.textContent=t; e.style.color=warn?"#f3c56b":"#b9c0cc"; }

/* ===================== Cálculo del ER ===================== */
/* Facturación de cada unidad de negocio (firma + actividad): suma de los importes positivos del rubro Ventas
   (facturación bruta: no resta compras de hacienda, ajustes ni diferencias de inventario). */
function ponderadores(campId, modo){
  const L=lineasDe(campId).map(l=>({...l,r:rubroDe(l)}));
  const fact={};
  L.forEach(l=>{ if(l.a!=="general" && l.r==="ventas" && l.v>0){ const k=l.f+"|"+l.a; fact[k]=(fact[k]||0)+l.v; } });
  const units=Object.entries(fact).map(([k,v])=>{ const [f,a]=k.split("|"); return {k,f,a,fact:v}; });
  const totG=units.reduce((s,u)=>s+u.fact,0);
  const totF={}; units.forEach(u=>totF[u.f]=(totF[u.f]||0)+u.fact);
  units.forEach(u=>{ u.pctGrupo=totG?u.fact/totG:0; u.pctFirma=totF[u.f]?u.fact/totF[u.f]:0; u.w = modo==="fact_firma"?u.pctFirma:u.pctGrupo; });
  const fIds=M.firmas.map(f=>f.id), aIds=M.actividades.map(a=>a.id);
  units.sort((x,y)=>fIds.indexOf(x.f)-fIds.indexOf(y.f)||aIds.indexOf(x.a)-aIds.indexOf(y.a));
  return {units,totG,totF};
}
function lineasVista(campId){
  let L = lineasDe(campId).map(l=>({...l, r:rubroDe(l)}));
  if(ui.prorrateo!=="no"){
    const {units}=ponderadores(campId,ui.prorrateo);
    const gen=L.filter(l=>l.a==="general"), out=L.filter(l=>l.a!=="general");
    gen.forEach(l=>{
      const dest = ui.prorrateo==="fact_firma" ? units.filter(u=>u.f===l.f) : units;
      if(!dest.length){ out.push(l); return; }
      dest.forEach(u=>out.push({...l, f:u.f, a:u.a, fo:l.f, v:l.v*u.w, prorr:true}));
    });
    L=out;
  }
  if(ui.firma!=="all") L=L.filter(l=>l.f===ui.firma);
  return L;
}
function tablaPonderadores(){
  const {units,totG,totF}=ponderadores(ui.camp,ui.prorrateo);
  if(!units.length) return "";
  const asig={}; lineasVista(ui.camp).filter(l=>l.prorr).forEach(l=>{ const k=l.f+"|"+l.a; asig[k]=(asig[k]||0)+l.v; });
  const totA=Object.values(asig).reduce((a,b)=>a+b,0);
  const porFirma = ui.prorrateo==="fact_firma";
  const rows=units.filter(u=>ui.firma==="all"||u.f===ui.firma);

    ${ui.firma==="all"?`<tr class="calc"><td><b>Total</b></td><td></td><td class="r"><b>${fnum(totG)}</b></td><td class="r"><b>100,0%</b></td>${porFirma?"<td></td>":""}<td class="r num ${totA<0?"neg":""}"><b>${fnum(totA)}</b></td></tr>`:""}

}
function columnas(L){
  const ord = (arr,ref)=>arr.sort((a,b)=>ref.indexOf(a)-ref.indexOf(b));
  const fIds=M.firmas.map(f=>f.id), aIds=M.actividades.map(a=>a.id);
  if(ui.vista==="firma"){
    const fs=ord([...new Set(L.map(l=>l.f))],fIds);
    return {groups:null, cols:fs.map(f=>({key:f,label:firmaN(f),match:l=>l.f===f}))};
  }
  if(ui.vista==="grupo"){
    const gOf=a=>(actById(a)||{}).grupo||"Sin grupo";
    const gRef=[...new Set(M.actividades.map(a=>a.grupo||"Sin grupo"))];
    const gs=ord([...new Set(L.map(l=>gOf(l.a)))],gRef);
    return {groups:null, cols:gs.map(g=>({key:g,label:g,match:l=>gOf(l.a)===g}))};
  }
  // por actividad, agrupado por firma
  const fs=ord([...new Set(L.map(l=>l.f))],fIds);
  const groups=[], cols=[];
  fs.forEach(f=>{
    const as=ord([...new Set(L.filter(l=>l.f===f).map(l=>l.a))],aIds);
    const sub = as.length>1;
    groups.push({label:firmaN(f),span:as.length+(sub?1:0),sub});
    as.forEach(a=>cols.push({key:f+"|"+a,label:actN(a),match:l=>l.f===f&&l.a===a}));
    if(sub) cols.push({key:f+"|tot",label:"Total firma",match:l=>l.f===f,sub:true});
  });
  return {groups,cols};
}
function sumR(L,match,r){ let s=0; for(const l of L) if(l.r===r && match(l)) s+=l.v; return s; }
function calcRows(L,match){
  const v={}; RUBROS.forEach(r=>v[r.id]=sumR(L,match,r.id));
  v.cm = v.ventas+v.costo_ventas;
  v.mb = v.cm+v.estructura;
  v.mn = v.mb+v.intereses+v.amortizaciones+v.impuestos+v.retiros+v.sin_asignar;
  v.rt = v.mn+v.tenencia;
  return v;
}
function rowDefs(L){
  const hasSin = L.some(l=>l.r==="sin_asignar");
  const rows=[
    {k:"ventas",lbl:"Ventas",n:1,exp:true},
    {k:"costo_ventas",lbl:"Costo de ventas",n:2,exp:true},
    {k:"cm",lbl:"Contribución marginal",n:3,calc:true},
    {k:"estructura",lbl:"Costos de estructura",n:4,exp:true,byCat:true},
    {k:"mb",lbl:"Margen bruto",n:5,calc:true},
    {k:"intereses",lbl:"Intereses financieros",n:6,exp:true},
    {k:"amortizaciones",lbl:"Amortizaciones de bienes de uso",n:7,exp:true},
    {k:"impuestos",lbl:"Impuestos",n:8,exp:true},
    {k:"retiros",lbl:"Retiros",n:9,exp:true},
  ];
  if(hasSin) rows.push({k:"sin_asignar",lbl:"⚠ Conceptos sin asignar a rubro",n:"",exp:true,warn:true});
  rows.push({k:"mn",lbl:"Margen neto",n:10,calc:true,big:true});
  rows.push({k:"tenencia",lbl:"Resultado por tenencia",n:"",exp:true,extra:true});
  rows.push({k:"rt",lbl:"Resultado incluyendo tenencia",n:"",calc:true});
  return rows;
}

function cell(v,ventas,cls=""){ const neg=v<-0.004?" neg":""; return `<td class="num${neg} ${cls}">${fnum(v)}</td>`; }
// Cada columna del ER: importe y/o % sobre las ventas de esa misma columna (actividad, firma o total).
const nPer=()=>ui.modo==="both"?2:1;
function par(v,ventas,cls=""){ return (ui.modo!=="pct"?cell(v,ventas,cls):"")+(ui.modo!=="usd"?pcell(v,ventas,cls+" sep"):""); }
function hpar(label,cls=""){ return (ui.modo!=="pct"?`<th class="${cls}">${esc(label)}</th>`:"")+(ui.modo!=="usd"?`<th class="${cls} pctc sep">${ui.modo==="pct"?esc(label)+"<br>":""}% s/ vtas</th>`:""); }
function pcell(v,ventas,cls=""){ const p=(ventas&&Math.abs(v)>=0.005)? v/ventas : null; const neg=(p!==null&&p<-0.00005)?" neg":""; return `<td class="num pctc${neg} ${cls}">${fpct(p)}</td>`; }
function detalleRows(L,r,cols,byCat){
  const items=L.filter(l=>l.r===r.k);
  const conceptos=[...new Set(items.map(l=>l.c))];
  const tot=c=>items.filter(l=>l.c===c).reduce((a,l)=>a+l.v,0);
  conceptos.sort((a,b)=>tot(a)-tot(b));
  const vent=cols.map(c=>sumR(L,c.match,"ventas")), ventT=sumR(L,()=>true,"ventas");
  const line=(lbl,pred,cls)=>{ const tv=items.filter(pred).reduce((a,l)=>a+l.v,0);
    return `<tr class="${cls}"><td>${lbl}</td>${cols.map((c,i)=>{ const v=items.filter(l=>pred(l)&&c.match(l)).reduce((a,l)=>a+l.v,0); return par(v,vent[i],c.sub?"tot":""); }).join("")}${par(tv,ventT,"tot")}</tr>`; };
  let h="";
  if(byCat){
    const cats=[...new Set(items.map(catDe))].sort((a,b)=>{const ia=M.categorias.indexOf(a),ib=M.categorias.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
    cats.forEach(cat=>{
      h+=line(esc(cat),l=>catDe(l)===cat,"cat");
      conceptos.filter(c=>items.some(l=>l.c===c&&catDe(l)===cat)).forEach(c=>{ h+=line(esc((cuentaById(c)||{nombre:c}).nombre),l=>l.c===c&&catDe(l)===cat,"sub"); });
    });
  } else conceptos.forEach(c=>{ h+=line(esc((cuentaById(c)||{nombre:c}).nombre),l=>l.c===c,"sub"); });
  if(!items.length) h+=`<tr class="sub"><td class="muted">Sin conceptos cargados</td>${cols.map(c=>`<td class="${c.sub?"tot":""}"></td>`.repeat(nPer())).join("")}${'<td class="tot"></td>'.repeat(nPer())}</tr>`;
  return h;
}
function tablaER(L){
  const {groups,cols}=columnas(L);
  const V=cols.map(c=>calcRows(L,c.match)), T=calcRows(L,()=>true);
  let h=`<div class="tablewrap"><table><thead>`;
  if(groups) h+=`<tr class="g"><th></th>${groups.map(g=>`<th colspan="${g.span*nPer()}" style="text-align:center;border-left:1px solid var(--line)">${esc(g.label)}</th>`).join("")}<th class="tot" colspan="${nPer()}"></th></tr>`;
  h+=`<tr class="${groups?"h":""}"><th>Concepto</th>${cols.map(c=>hpar(c.label,c.sub?"tot":"")).join("")}${hpar("Total","tot")}</tr></thead><tbody>`;
  rowDefs(L).forEach(r=>{
    const open=ui.open.has(r.k);
    const cls=[r.calc?"calc":"",r.big?"big":"",r.warn?"warn":"",r.extra?"extra":""].join(" ");
    const lbl=`<span class="rlabel ${r.exp?"tg"+(open?" open":""):""}" ${r.exp?`data-tg="${r.k}"`:""}>${r.exp?'<span class="car">▸</span>':'<span class="car"></span>'}<span class="n">${r.n}</span>${esc(r.lbl)}</span>`;
    h+=`<tr class="${cls}"><td>${lbl}</td>${cols.map((c,i)=>par(V[i][r.k],V[i].ventas,c.sub?"tot":"")).join("")}${par(T[r.k],T.ventas,"tot")}</tr>`;
    if(r.exp&&open) h+=detalleRows(L,r,cols,r.byCat);
  });
  return h+`</tbody></table></div>`;
}
function tablaComparativa(L,comp){
  const L2=lineasVista(comp);
  const A=calcRows(L,()=>true), B=calcRows(L2,()=>true);
  const nA=(M.campanas.find(c=>c.id===ui.camp)||{}).nombre, nB=(M.campanas.find(c=>c.id===comp)||{}).nombre;
  let h=`<div class="tablewrap"><table><thead><tr><th>Concepto</th><th>${esc(nA)}</th><th class="pctc">% s/ ventas</th><th>${esc(nB)}</th><th class="pctc">% s/ ventas</th><th class="tot">Variación USD</th><th class="tot">Variación %</th></tr></thead><tbody>`;
  const row=(lbl,a,b,cls)=>{ const d=a-b; const p=Math.abs(b)>0.01? d/Math.abs(b):null;
    return `<tr class="${cls}"><td>${lbl}</td>${cell(a,A.ventas)}${pcell(a,A.ventas)}${cell(b,B.ventas)}${pcell(b,B.ventas)}<td class="num tot ${d<0?"neg":""}">${fnum(d)}</td><td class="num tot ${d<0?"neg":""}">${fpct(p)}</td></tr>`; };
  rowDefs([...L,...L2]).forEach(r=>{
    const open=ui.open.has(r.k);
    const cls=[r.calc?"calc":"",r.big?"big":"",r.warn?"warn":"",r.extra?"extra":""].join(" ");
    const lbl=`<span class="rlabel ${r.exp?"tg"+(open?" open":""):""}" ${r.exp?`data-tg="${r.k}"`:""}>${r.exp?'<span class="car">▸</span>':'<span class="car"></span>'}<span class="n">${r.n}</span>${esc(r.lbl)}</span>`;
    h+=row(lbl,A[r.k],B[r.k],cls);
    if(r.exp&&open){
      const cs=[...new Set([...L,...L2].filter(l=>l.r===r.k).map(l=>l.c))];
      cs.forEach(c=>{ const a=L.filter(l=>l.r===r.k&&l.c===c).reduce((s,l)=>s+l.v,0), b=L2.filter(l=>l.r===r.k&&l.c===c).reduce((s,l)=>s+l.v,0);
        h+=row(esc((cuentaById(c)||{nombre:c}).nombre),a,b,"sub"); });
    }
  });
  return h+`</tbody></table></div>`;
}

function uniqueCuentaId(n){ let b=slug(n),i=b,k=2; while(P.cuentas.some(c=>c.id===i)) i=b+"-"+(k++); return i; }
function addLineas(arr){ if(!CAMPS[ui.camp]) CAMPS[ui.camp]={lineas:[]}; CAMPS[ui.camp].lineas.push(...arr); store.saveCamp(ui.camp); }
function findBy(list,txt){ const t=String(txt).trim().toLowerCase(); return list.find(x=>x.id.toLowerCase()===t||x.nombre.toLowerCase()===t); }
function importarPegado(){
  const rows=$("#pTxt").value.split(/\r?\n/).map(r=>r.split("\t")).filter(r=>r.join("").trim());
  const signo=$("#pSigno").checked; const ok=[], err=[]; let nuevas=0;
  rows.forEach((r,i)=>{
    if(r.length<4){ err.push(`Fila ${i+1}: faltan columnas`); return; }
    const f=findBy(M.firmas,r[0]), a=findBy(M.actividades,r[1]); const n=r[2].trim(); let v=parseNum(r[3]);
    if(!f){ err.push(`Fila ${i+1}: firma “${r[0]}” no existe`); return; }
    if(!a){ err.push(`Fila ${i+1}: actividad “${r[1]}” no existe`); return; }
    if(!n||isNaN(v)){ err.push(`Fila ${i+1}: concepto o importe inválido`); return; }
    let c=P.cuentas.find(x=>x.nombre.toLowerCase()===n.toLowerCase());
    if(!c){ c={id:uniqueCuentaId(n),nombre:n,rubro:"sin_asignar",cat:""}; P.cuentas.push(c); nuevas++; }
    if(signo) v=Math.abs(v)*((RB[c.rubro]?.signo??-1));
    ok.push({id:uid(),f:f.id,a:a.id,c:c.id,v:Math.round(v*100)/100,d:(r[4]||"").trim()});
  });
  if(nuevas) store.savePlan();
  if(ok.length) addLineas(ok);
  render();
  $("#pMsg").innerHTML=`${ok.length} filas importadas${nuevas?` · ${nuevas} cuentas nuevas sin asignar`:""}${err.length?`<br><span style="color:var(--neg)">${err.map(esc).join("<br>")}</span>`:""}`;
}

function aplicarDoc(path, data){
  if(path==="config/maestros"){ M={firmas:data.firmas||[],actividades:data.actividades||[],campanas:data.campanas||[],categorias:data.categorias||CATS_DEFAULT.slice()}; }

  else if(path.startsWith("campanas/")){ CAMPS[path.slice(9)]=data; }

function sbAdapter(){
  const clone=o=>JSON.parse(JSON.stringify(o));
  const guardar=(path,data)=>enqueue(path,async()=>{
    if(soloLectura){ toast("Tu usuario es de consulta: no puede modificar datos"); return; }
    const {error}=await sb.from("docs").upsert({path,data,updated_at:new Date().toISOString()});
    if(error){ console.error(error); toast(/row-level|permission|policy/i.test(error.message)?"No tenés permiso para modificar datos":"No se pudo guardar: "+error.message); }
  });
  return {
    kind:"supabase",
    async start(){
      setStatus("Cargando datos…");
      const {data,error}=await sb.from("docs").select("path,data");
      if(error){ setStatus("Error al leer la base: "+error.message,true); return; }
      CAMPS={}; (data||[]).forEach(r=>aplicarDoc(r.path,r.data));
      loaded={m:true,p:true,c:true}; setStatus("Datos en la nube"); render();
      sb.channel("docs-cambios").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{
        if(pl.eventType==="DELETE"){ const pth=(pl.old||{}).path||""; if(pth.startsWith("campanas/")) delete CAMPS[pth.slice(9)]; }
        else if(pl.new) aplicarDoc(pl.new.path,pl.new.data);
        render();
      }).subscribe();
    },
    saveMaestros(){ return guardar("config/maestros",clone(M)); },
    savePlan(){ return guardar("config/plan",clone(P)); },
    saveCamp(id){ return guardar("campanas/"+id,clone(CAMPS[id]||{lineas:[]})); },
    deleteCamp(id){ delete CAMPS[id]; return enqueue("campanas/"+id,async()=>{ if(soloLectura) return; const {error}=await sb.from("docs").delete().eq("path","campanas/"+id); if(error) toast("No se pudo eliminar: "+error.message); }); },
  };
}

    c.innerHTML=cab+`<p class="muted" style="font-size:13px">Te mandamos un mail con un link para elegir una contraseña nueva.</p>
      <div class="fld"><label>Mail</label><input type="email" id="lgMail" autocomplete="email"></div>
      <button class="btn" id="lgGo">Enviar link</button><button class="lnk" id="lgVolver">Volver al ingreso</button><div class="err" id="lgErr">${esc(msg||"")}</div>`;
    $("#lgVolver").onclick=()=>pantallaLogin("login");
    $("#lgGo").onclick=async()=>{ const m=$("#lgMail").value.trim(); if(!m) return;
      const {error}=await sb.auth.resetPasswordForEmail(m,{redirectTo:location.origin+location.pathname});
      $("#lgErr").style.color=error?"":"var(--pos)"; $("#lgErr").textContent=error?error.message:"Listo: revisá tu mail (y la carpeta de spam)."; };
    return;
  }
  c.innerHTML=cab+`<div class="fld"><label>Mail</label><input type="email" id="lgMail" autocomplete="username"></div>
    <div class="fld"><label>Contraseña</label><input type="password" id="lgPass" autocomplete="current-password"></div>
    <button class="btn" id="lgGo">Ingresar</button><button class="lnk" id="lgOlv">Olvidé mi contraseña</button><div class="err" id="lgErr">${esc(msg||"")}</div>`;
  const go=async()=>{ $("#lgErr").textContent=""; $("#lgGo").disabled=true;
    const {data,error}=await sb.auth.signInWithPassword({email:$("#lgMail").value.trim(),password:$("#lgPass").value});
    $("#lgGo").disabled=false;
    if(error){ $("#lgErr").textContent=/invalid/i.test(error.message)?"Mail o contraseña incorrectos.":error.message; return; }
    entrar(data.session); };
  $("#lgGo").onclick=go; $("#lgPass").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  $("#lgOlv").onclick=()=>pantallaLogin("olvide");
  setTimeout(()=>$("#lgMail")?.focus(),50);
}
let entrado=false;
async function entrar(session){
  if(entrado) return; entrado=true;
  $("#login").classList.remove("on");
  const mail=(session.user.email||"").toLowerCase();
  const {data}=await sb.from("editores").select("email").eq("email",mail);
  soloLectura=!(data&&data.length);
  $("#userMail").textContent=mail; $("#userRol").textContent=soloLectura?"Consulta":"Editor"; $("#userBox").style.display="flex";
  store=sbAdapter(); await store.start();
  setTimeout(()=>verNovedades(false),400);
}
async function iniciarSupabase(){
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,detectSessionInUrl:true}});
  $("#btnSalir").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  sb.auth.onAuthStateChange((ev)=>{ if(ev==="PASSWORD_RECOVERY"){ entrado=false; $("#userBox").style.display="none"; pantallaLogin("nueva"); } });
  if(/type=recovery/.test(location.hash)) return;   // espera el evento PASSWORD_RECOVERY
  const {data:{session}}=await sb.auth.getSession();
  if(session) entrar(session); else { setStatus("Ingresá con tu usuario"); pantallaLogin("login"); }
}
const USAR_SUPABASE = /github\.io$/i.test(location.hostname) || /[?&]sb=1/.test(location.search);

/* ===================== Inicio ===================== */
$("#verTxt").textContent=APP_VERSION;
$("#btnNov").addEventListener("click",()=>verNovedades(true));
if(!USAR_SUPABASE) setTimeout(()=>verNovedades(false),400);
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; ui.tab=b.dataset.t; render(); });
render();
(async()=>{
  if(USAR_SUPABASE){
    if(window.supabase){ await iniciarSupabase(); }
    else setStatus("No se pudo cargar la conexión a la base. Revisá internet y recargá.",true);
    return;
  }
  let db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(db){ store=dbAdapter(db); store.start(); setStatus("Conectado"); }
  else { store=localAdapter(); store.start(); setStatus("Modo local: los cambios quedan sólo en este navegador",true); }
})();
</script>
